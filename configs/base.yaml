# HEMT-CLIP base config — all hyperparameters in one place
# Edit values here rather than hard-coding in scripts.

seed: 42

data:
  hdf5_path: /content/drive/MyDrive/hemt-clip-fnd/data/fakeddit.h5
  splits_dir: data/splits
  train_csv: data/splits/train.csv
  val_csv:   data/splits/val.csv
  test_csv:  data/splits/test.csv
  num_samples: 15000        # target after broken-URL filtering
  oversample_for_download: 18000
  image_size: 224
  max_text_len: 128
  num_workers: 2
  pin_memory: true

model:
  text:
    name: roberta-base
    hidden_dim: 768
    proj_dim: 512
    trainable_layers: 4     # last N transformer layers (bumped 2→4 on 2026-05-17 for headroom)
    dropout: 0.1
  image:
    name: openai/clip-vit-base-patch16   # swapped B/32 → B/16 on 2026-05-30 for 4× finer patch grid (49 → 196 tokens); v3 regularization plateaued at 0.8012, swapping the backbone is the next lever
    embed_dim: 512
    trainable_blocks: 4     # bumped 2→4 on 2026-05-17 for headroom
  fusion:
    num_heads: 8
    ffn_dim: 2048
    dropout: 0.2             # bumped 0.1→0.2 on 2026-05-30 — v2 hemt_clip peaked at S2 ep3 then drifted down while train_acc kept climbing (overfit in fusion block, only variant using it)
  classifier:
    hidden_dim: 256
    dropout: 0.3
    num_classes: 2
  use_alpha: true            # concat CLIP similarity α to fused features

training:
  optimizer: adamw
  weight_decay: 0.01
  label_smoothing: 0.0       # dropped 0.1→0.0 on 2026-05-17 (capping val_loss, no class noise to smooth over)
  warmup_ratio: 0.1
  grad_clip: 1.0
  mixed_precision: true
  gradient_checkpointing: true
  early_stopping_patience: 3 # bumped 2→3 on 2026-05-17 alongside longer stage 2

  stage1:                    # head warmup, encoders frozen
    epochs: 1
    lr: 1.0e-4
  stage2:                    # encoder fine-tuning
    epochs: 6                # bumped 3→6 on 2026-05-17 — variants were still improving at ep3
    lr: 2.0e-5

  # Per-GPU batch size — auto-overridden by gpu detection in train.py
  batch_size:
    T4: 16
    L4: 32
    A100: 64
  grad_accum_steps: 2

logging:
  tensorboard_dir: /content/drive/MyDrive/hemt-clip-fnd/runs
  run_name_prefix: hemt        # full run name = "{prefix}_{variant}_{YYYYMMDD-HHMM}"
  log_every_n_steps: 50
  sample_predictions_every: 500
  hist_every_n_epochs: 1       # weight/grad histograms per epoch (cheap, useful)

checkpointing:
  dir: /content/drive/MyDrive/hemt-clip-fnd/checkpoints
  save_every_epoch: true
  keep_last_n: 2

ablation:
  # gated_fusion (added 2026-05-31): same cross-attention as hemt_clip, but alpha
  # is used as a CLIP-similarity gate inside fusion (alpha*attended + (1-alpha)*text)
  # instead of being concatenated as a feature. Isolates "alpha as gate" (prior-work
  # approach, e.g. FND-CLIP) vs "alpha as learned feature" (ours) — the empirical
  # test behind the report's novelty claim.
  variants: [text_only, image_only, concat_fusion, hemt_clip, gated_fusion]
